name: Build DLAY

# Builds and tests the plug-in on Windows, macOS and Linux.
#
# Downloads:
#   - Every successful build of the main branch is published on the repository's Releases
#     page as "DLAY - latest build" (replaced each time).
#   - A numbered release: push a tag such as v1.0.0, or start this workflow by hand
#     (Actions > Build DLAY > Run workflow) and type the version number.
#   - Every run also keeps its three archives under "Artifacts" at the bottom of its page.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this build as a numbered release, e.g. 1.0.0 (leave empty for none)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 + Standalone)
            os: windows-latest
            package: DLAY-Windows
          - name: macOS universal (VST3 + AU + Standalone)
            os: macos-latest
            package: DLAY-macOS
          - name: Linux (VST3 + Standalone)
            os: ubuntu-latest
            package: DLAY-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxcomposite-dev libxi-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl-dev xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDLAY_BUILD_HOST_CHECK=ON

      # The number of jobs is named on purpose: left out, make starts every compile at
      # once, and that exhausts the memory of a small build machine.
      - name: Build
        shell: bash
        run: |
          jobs=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          echo "building with $jobs jobs"
          cmake --build build --config Release --parallel "$jobs"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -R DLAY_Tests

      # One archive per system, made here rather than by the upload step: that keeps the
      # file permissions the Mac bundles need.
      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.package }}"
          for folder in VST3 AU Standalone; do
            if [ -d "build/DLAY_artefacts/Release/$folder" ]; then
              cp -R "build/DLAY_artefacts/Release/$folder" "dist/${{ matrix.package }}/"
            fi
          done
          cp INSTALL.txt "dist/${{ matrix.package }}/"

          # macOS: seal each bundle with an ad-hoc signature as the very last step. JUCE signs
          # the VST3 before it writes moduleinfo.json into it, which leaves that seal broken;
          # Apple Silicon only loads code whose signature is intact.
          if [ "$RUNNER_OS" = "macOS" ]; then
            for bundle in "dist/${{ matrix.package }}/VST3/DLAY.vst3" \
                          "dist/${{ matrix.package }}/AU/DLAY.component" \
                          "dist/${{ matrix.package }}/Standalone/DLAY.app"; do
              if [ -d "$bundle" ]; then
                codesign --force --sign - "$bundle" || echo "::warning::could not sign $bundle"
                codesign --verify --strict "$bundle" && echo "signature intact: $bundle"
                echo "architectures: $(lipo -archs "$bundle/Contents/MacOS/DLAY" 2>/dev/null || echo unknown)"
              fi
            done
          fi

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${{ matrix.package }}.zip" "${{ matrix.package }}"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "${{ matrix.package }}" "${{ matrix.package }}.zip"
          else
            zip -qry "${{ matrix.package }}.zip" "${{ matrix.package }}"
          fi
          ls -l

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.zip
          if-no-files-found: error

      # Loads the VST3 that was just built the way a DAW does: scan it, process audio at
      # several sample rates, save and restore its state, open the editor while audio runs.
      # After the upload, so that a build is still there to look at if this fails.
      - name: Load the plug-in in a host
        run: ctest --test-dir build -C Release --output-on-failure -R DLAY_HostCheck

  release:
    name: Publish downloads
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ls -l dist
          notes="Download the archive for your system, unzip it and follow INSTALL.txt inside."

          if [ -n "$VERSION" ]; then
            # started by hand with a version number
            gh release create "v${VERSION#v}" dist/*.zip --repo "$REPO" --target "$GITHUB_SHA" \
              --title "DLAY ${VERSION#v}" --notes "$notes"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$REPO" \
              --title "DLAY ${GITHUB_REF_NAME#v}" --notes "$notes"
          else
            # the newest successful build of main: replace the previous one
            gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
            gh release create latest dist/*.zip --repo "$REPO" --target "$GITHUB_SHA" \
              --title "DLAY - latest build" \
              --notes "The newest successful build of the main branch (commit ${GITHUB_SHA::7}). $notes"
          fi
